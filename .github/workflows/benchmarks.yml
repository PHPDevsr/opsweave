name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - go.mod
      - go.sum
      - .github/workflows/benchmarks.yml
  pull_request:
    paths:
      - 'internal/**'
      - go.mod
      - go.sum
      - .github/workflows/benchmarks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Run benchmarks
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH CGO_ENABLED
            uname -a
            lscpu
          } > benchmark-environment.txt
          go test -run '^$' -bench '^Benchmark' -benchmem -benchtime=200ms -count=3 -cpu=1 \
            ./internal/notificationaction ./internal/fileaction ./internal/dockeraction ./internal/shellaction ./internal/httpaction ./internal/webhook ./internal/schedule ./internal/workflow ./internal/registry ./internal/storage/sqlite ./internal/execution ./internal/engine \
            | tee benchmark-results.txt
          for family in NotificationWebhook FilesystemCopy DockerInspectIPC ShellExecution HTTPPolicy WebhookAuthentication CronScan ScheduleDueScan Parse ValidateCondition EvaluateCondition Prepare SQLiteApply SQLiteGet SQLiteList SQLiteMigrate Transition ManualExecution ExecutionHistory ReliablePolicy ReliableHistory DispatcherClaim DispatcherThroughput ExecutionPrune/Apply100 ExecutionPrune/Preview1000 ServerWorkerStatus; do
            grep -q "^Benchmark${family}" benchmark-results.txt
          done
      - name: Upload benchmark results
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-benchmarks-${{ github.sha }}
          path: |
            benchmark-results.txt
            benchmark-environment.txt
          if-no-files-found: error
          retention-days: 14
